services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexmart
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexmart"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nexmart
      JWT_SECRET: local-development-only-change-for-anything-real
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # Migrations and seed run before the server, so a fresh volume comes up with a
    # working catalogue and no manual steps.
    command: sh -c "npx prisma migrate deploy && npm run seed && npm start"

volumes:
  postgres-data:
